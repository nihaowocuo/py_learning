<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Qwen 智能助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #19b6a4;
    --primary-dark: #128a7c;
    --bg: #f1f5f4;
    --card: #ffffff;
    --bot-bubble: #ffffff;
    --user-bubble: linear-gradient(135deg, #1fc7b3, #19b6a4);
    --text: #1f2430;
    --muted: #8a93a6;
  }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .chat-container {
    max-width: 480px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--card);
    box-shadow: 0 10px 40px rgba(20, 120, 110, 0.12);
  }
  .chat-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    background: linear-gradient(135deg, #1fc7b3, #15a892);
    color: #fff;
  }
  .chat-header .avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .chat-header .title { flex: 1; }
  .chat-header h1 { font-size: 17px; font-weight: 600; }
  .chat-header .status {
    font-size: 12px; opacity: 0.9;
    display: flex; align-items: center; gap: 5px;
  }
  .chat-header .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4ef0a3; box-shadow: 0 0 6px #4ef0a3;
  }
  .reset-btn {
    border: none; cursor: pointer;
    background: rgba(255,255,255,0.22);
    color: #fff; font-size: 13px;
    padding: 7px 12px; border-radius: 20px;
    transition: background 0.2s;
  }
  .reset-btn:hover { background: rgba(255,255,255,0.35); }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: var(--bg);
  }
  .msg { display: flex; align-items: flex-end; gap: 8px; max-width: 100%; }
  .msg .avatar-mini {
    width: 30px; height: 30px; border-radius: 50%;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 16px; background: #e0efec;
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar-mini { background: #d2efe9; }
  .bubble {
    max-width: 76%;
    padding: 11px 15px;
    border-radius: 16px;
    line-height: 1.55;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-break: break-word;
    box-shadow: 0 2px 8px rgba(40, 60, 120, 0.06);
  }
  .msg.bot .bubble {
    background: var(--bot-bubble);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .typing {
    display: flex; gap: 4px; align-items: center;
    padding: 10px 16px 6px 54px;
  }
  .typing.hidden { display: none; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  .input-area {
    display: flex; gap: 10px;
    padding: 14px 16px;
    background: var(--card);
    border-top: 1px solid #eceff6;
  }
  .input-area input {
    flex: 1;
    border: 1px solid #dfe4ef;
    border-radius: 22px;
    padding: 11px 16px;
    font-size: 14.5px;
    outline: none;
    transition: border 0.2s;
  }
  .input-area input:focus { border-color: var(--primary); }
  .input-area button {
    border: none; cursor: pointer;
    background: var(--primary);
    color: #fff; font-size: 14.5px; font-weight: 600;
    padding: 0 20px; border-radius: 22px;
    transition: background 0.2s, transform 0.1s;
  }
  .input-area button:hover { background: var(--primary-dark); }
  .input-area button:disabled { opacity: 0.55; cursor: not-allowed; }
  .input-area button:active { transform: scale(0.97); }
</style>
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <div class="avatar">🤖</div>
      <div class="title">
        <h1>Qwen 智能助手</h1>
        <span class="status"><span class="dot"></span>在线</span>
      </div>
      <button id="resetBtn" class="reset-btn">清空对话</button>
    </header>

    <div id="messages" class="messages">
      <div class="msg bot">
        <div class="avatar-mini">🤖</div>
        <div class="bubble">你好！我是基于 Qwen 的 AI 助手（由硅基流动提供），有什么可以帮您？😊</div>
      </div>
    </div>

    <div id="typing" class="typing hidden">
      <span></span><span></span><span></span>
    </div>

    <div class="input-area">
      <input id="userInput" type="text" placeholder="输入您的问题，回车发送..." autocomplete="off" />
      <button id="sendBtn">发送</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const resetBtn = document.getElementById("resetBtn");
    const typingEl = document.getElementById("typing");

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessage(text, who) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + who;
      const avatar = document.createElement("div");
      avatar.className = "avatar-mini";
      avatar.textContent = who === "user" ? "🙋" : "🤖";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      wrap.appendChild(avatar);
      wrap.appendChild(bubble);
      messagesEl.appendChild(wrap);
      scrollToBottom();
    }

    function setTyping(on) {
      typingEl.classList.toggle("hidden", !on);
      if (on) scrollToBottom();
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      addMessage(text, "user");
      inputEl.value = "";
      sendBtn.disabled = true;
      setTyping(true);
      try {
        const resp = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        const data = await resp.json();
        setTyping(false);
        if (data.error) {
          addMessage("⚠️ " + data.error, "bot");
        } else {
          addMessage(data.reply, "bot");
        }
      } catch (e) {
        setTyping(false);
        addMessage("⚠️ 网络错误：" + e.message, "bot");
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener("click", send);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    resetBtn.addEventListener("click", async () => {
      messagesEl.innerHTML =
        '<div class="msg bot"><div class="avatar-mini">🤖</div>' +
        '<div class="bubble">对话已清空，有什么可以帮您？😊</div></div>';
      try {
        await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: "reset" }),
        });
      } catch (_) {}
    });

    inputEl.focus();
  </script>
</body>
</html>
